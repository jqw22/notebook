name: Deploy to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Prefer `npm ci`: it installs exactly what the lockfile pins and fails if
      # package.json and the lockfile have diverged, which is what we want.
      # It requires a committed package-lock.json, so fall back to `npm install`
      # until that exists.
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "No package-lock.json yet; using npm install (commit a lockfile to enable npm ci)."
            npm install
          fi

      # Runs the project's own `test` script: tsc --noEmit, eslint, vitest,
      # then a production build. DEPLOY_BASE makes the build use the correct
      # sub-path for GitHub Pages project sites, and the script copies
      # index.html to 404.html for SPA routing.
      - name: Type-check, lint, test, and build
        run: npm run test
        env:
          DEPLOY_BASE: /${{ github.event.repository.name }}/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
